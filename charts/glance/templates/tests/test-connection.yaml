apiVersion: v1
kind: Pod
metadata:
  name: {{ include "glance.fullname" . }}-test-connection
  labels:
    {{- include "glance.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-q", "-O", "-", "http://{{ include "glance.fullname" . }}:{{ .Values.service.port }}/api/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
