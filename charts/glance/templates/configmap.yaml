{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glance.fullname" . }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}
data:
  glance.yml: |
    {{- include "glance.config" . | nindent 4 }}
  {{- range $name, $contents := .Values.extraConfigFiles }}
  {{ $name }}: |
    {{- $contents | nindent 4 }}
  {{- end }}
{{- end }}
