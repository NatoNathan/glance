{{- if and .Values.secretKey.generate (not .Values.secretKey.existingSecret) }}
{{- $name := include "glance.secretKeySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}
  annotations:
    # Deleting the Secret would log everyone out
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else }}
  {{- /* Glance expects 64 random bytes encoded as base64, the same as `glance secret:make` */}}
  secret-key: {{ randBytes 64 | b64enc }}
  {{- end }}
{{- end }}
